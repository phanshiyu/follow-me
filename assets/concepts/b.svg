<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">follow-me: a sweaty commit blob chasing a smug HEAD blob wearing a party hat</title>
  <rect x="4" y="4" width="248" height="248" rx="44" fill="#fff4c2" stroke="#222" stroke-width="6"/>
  <!-- the branch -->
  <path d="M8 196 L248 196" stroke="#222" stroke-width="10" stroke-linecap="round"/>
  <circle cx="22" cy="196" r="10" fill="#fff" stroke="#222" stroke-width="5"/>
  <!-- HEAD: smug leader blob -->
  <g stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 172 L168 196 M196 172 L206 194" fill="none"/>
    <path d="M140 132 Q138 86 182 84 Q226 84 226 132 Q226 176 182 176 Q140 176 140 132 Z" fill="#ff5a5f"/>
    <path d="M166 48 L182 86 L152 88 Z" fill="#7ad151"/>
    <path d="M160 116 L176 118 M192 118 L208 114" fill="none"/>
    <path d="M168 146 Q184 156 202 142" fill="none"/>
  </g>
  <circle cx="171" cy="122" r="3.5" fill="#222"/>
  <circle cx="202" cy="120" r="3.5" fill="#222"/>
  <text x="140" y="70" font-family="monospace" font-weight="bold" font-size="14" fill="#222" text-anchor="middle" transform="rotate(-15 140 66)">HEAD</text>
  <!-- follower blob: trying its best -->
  <g stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 178 L52 196 M84 180 L98 192" fill="none"/>
    <path d="M28 140 Q24 100 70 98 Q118 98 116 142 Q116 182 72 182 Q30 184 28 140 Z" fill="#3ec1d3"/>
    <path d="M58 158 Q74 170 96 154" fill="none"/>
    <path d="M78 164 Q80 182 90 176 Q94 170 90 160" fill="#ff7aa8" stroke-width="4"/>
  </g>
  <circle cx="58" cy="124" r="20" fill="#fff" stroke="#222" stroke-width="5"/>
  <circle cx="68" cy="130" r="8" fill="#222"/>
  <circle cx="98" cy="120" r="9" fill="#fff" stroke="#222" stroke-width="4"/>
  <circle cx="95" cy="116" r="3.5" fill="#222"/>
  <!-- sweat + motion -->
  <path d="M120 92 Q126 104 120 108 Q114 104 120 92 Z" fill="#9fe0ff" stroke="#222" stroke-width="3"/>
  <path d="M12 112 L22 112 M8 130 L18 130 M12 148 L20 148" stroke="#222" stroke-width="4" stroke-linecap="round"/>
</svg>
