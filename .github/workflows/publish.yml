name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: refuse a tag that does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "$version" ] || { echo "tag v$tag but package.json says $version"; exit 1; }
      # The same gates as ci.yml, in the same order, as separate steps so a failure names its
      # step. The package's own prepublishOnly would repeat them, so publish skips scripts.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run ui:test
      - run: npm test
      - name: publish
        # Trusted publishing never asks for a login; if npm falls back to one, fail fast.
        timeout-minutes: 5
        run: npm publish --ignore-scripts
