name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run ui:test
      - name: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            grep -n -A 40 '^not ok' test.log | head -c 3500 | tr '\n' ' ' | sed 's/^/::error::/'; echo
            exit 1
          }

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/dogfood.sh
