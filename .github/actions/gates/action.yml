name: gates
description: Install and run the release gates, the same ones as ci.yml, as separate steps so a failure names its step.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - run: npm install -g npm@latest
      shell: bash
    - run: npm --version
      shell: bash
    - run: npm ci
      shell: bash
    - run: npm run lint
      shell: bash
    - run: npm run typecheck
      shell: bash
    - run: npm run build
      shell: bash
    - run: npm run ui:test
      shell: bash
    - run: npm test
      shell: bash
