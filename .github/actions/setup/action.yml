name: Set up follow-me
description: Install Node and the locked dependencies, with the npm download cache on or off.
inputs:
  node-version:
    description: Node version
    required: false
    default: '24'
  cache:
    description: "'true' caches npm's downloads; 'false' restores and saves no cache. Jobs that publish, push or hold an id-token pass 'false'."
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}
    - run: npm ci
      shell: bash
