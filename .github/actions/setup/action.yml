name: Set up follow-me
description: Install Node and the locked dependencies, with npm's download cache. Jobs that publish, push or hold an id-token use ../setup-uncached instead.
inputs:
  node-version:
    description: Node version
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
